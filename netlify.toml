# Netlify: no build step, the repo root is the site.
[build]
  publish = "."

# Backend source lives in the repo but is never served to the public.
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Files that change with each release: always revalidate (a cheap 304 when unchanged).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Images change rarely: cache for 30 days.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/icon-*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

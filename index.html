async function startXpCheckout(){const MSG={email_required:'Banza wongereho email yawe kuri profile mbere yo kwishyura.',nothing_to_pay:'Nta bwishyu ugomba gukora ubu.',boost_not_allowed:'Boost ikora gusa konti yishyuye kandi igaragara.',bad_boost_plan:'Iyi boost ntibaho. Hitamo indi.',bad_phone:'Nimero ya telefone ntabwo ikwiye. Yivugurure kuri profile.',suspended:'Konti yawe yahagaritswe.',not_configured:'Kwishyura ntibirakora. Ongera ugerageze nyuma.',unauthorized:'Injira bundi bushya, hanyuma ugerageze.',duplicate_request:'Tegereza amasegonda make, hanyuma ugerageze.'};try{const res=await fnCall('xentripay',{action:'checkout_create',purpose:payPurpose(),days:payData&&payData.days,origin:location.origin});if(res.error==='invalid_checkout_url'){console.error('[xentripay] checkout link refused:',res.reason,res.link_host,res.link_path);alert('Page yo kwishyura ntiyabonetse neza. Ongera ugerageze nyuma.\n('+(res.reason||'')+')');return}const go=xpSafeUrl(res.checkoutUrl);if(!go){console.error('[xentripay] no safe checkout link:',res.status||'',res.error||'',res.provider_http||'');alert('Ntibyakunze, ongera ugerageze.'+(res.provider_message?'\n('+res.provider_message+')':res.provider_http?'\n(XentriPAY '+res.provider_http+')':''));return}try{localStorage.setItem('uk.xp',JSON.stringify({id:res.payment_id,mode:payMode,role:payData&&payData.role,amount:res.amount,days:payData&&payData.days}))}catch(e){}location.href=go}catch(e){console.error('[xentripay] call failed:',e.status||'',e.message||'');alert(MSG[e.message]||'Ntibyakunze, ongera ugerageze. ('+(e.message||'')+')')}}


async function startXpPay(){const MSG={email_required:'Banza wongereho email yawe kuri profile.',nothing_to_pay:'Nta bwishyu ugomba gukora ubu.',boost_not_allowed:'Boost ikora gusa konti yishyuye kandi igaragara.',bad_boost_plan:'Iyi boost ntibaho. Hitamo indi.',bad_phone:'Nimero ya telefone ntabwo ikwiye.',suspended:'Konti yawe yahagaritswe.',not_configured:'Kwishyura ntibirakora. Ongera ugerageze nyuma.',unauthorized:'Injira bundi bushya, hanyuma ugerageze.',duplicate_request:'Tegereza amasegonda make, hanyuma ugerageze.'};const m=payData.method||'mtn';let phone='';if(m!=='card'){const el=document.getElementById('xp-phone');const dg=String(el?el.value:'').replace(/\D/g,'').slice(-9);const okNet=m==='mtn'?/^7[89]\d{7}$/.test(dg):/^7[23]\d{7}$/.test(dg);if(!okNet){alert(m==='mtn'?'Andika nimero ya MTN (078 cyangwa 079).':'Andika nimero ya Airtel (072 cyangwa 073).');return}phone='0'+dg;payData.phone=phone}try{const res=await fnCall('xentripay',{action:'initiate',method:m==='card'?'cc':'momo',phone,purpose:payPurpose(),days:payData&&payData.days,origin:location.origin});if(res.status==='REDIRECT'){const go=xpSafeUrl(res.url);if(!go){console.error('[xentripay] unsafe card link');alert('Ntibyakunze, ongera ugerageze.');return}try{localStorage.setItem('uk.xp',JSON.stringify({id:res.payment_id,mode:payMode,role:payData&&payData.role,amount:res.amount,days:payData&&payData.days}))}catch(e){}location.href=go;return}if(res.status==='PENDING'){app.innerHTML='<section class="page momo-wait"><div class="ring"></div><h2>Reba telefone yawe</h2><p style="color:var(--mut);line-height:1.5;margin-top:10px">Twohereje ubutumwa kuri '+phone+'. Emeza ubwishyu ukoresheje PIN yawe.</p></section>';return resumeXp({id:res.payment_id,mode:payMode,role:payData&&payData.role,amount:res.amount,days:payData&&payData.days},true)}console.error('[xentripay] initiate failed:',res.error||'',res.retcode||'',res.provider_http||'');const RC={606:'Ubwishyu ntibwakunze, cyangwa amafaranga ntahagije.',607:'Ubwishyu bwanzwe.',608:'Igihe cyararangiye. Ongera ugerageze.'};alert(RC[res.retcode]||'Ntibyakunze, ongera ugerageze.')}catch(e){console.error('[xentripay] call failed:',e.status||'',e.message||'');alert(MSG[e.message]||'Ntibyakunze, ongera ugerageze. ('+(e.message||'')+')')}}
function xpPick(m){payData.method=m;payRender()}
async function resumeXp(r,keep){payMode=r.mode||'signup';payData=Object.assign({},payData,{role:r.role,provider:'xentripay',days:r.days||boostDays,amount:r.amount,payId:r.id});if(!keep)app.innerHTML='<section class="page momo-wait"><div class="ring"></div><h2>Turimo kwemeza ubwishyu...</h2></section>';let ok=false;for(let i=0;i<60;i++){const s=await fnCall('xentripay',{action:'status',payment_id:r.id}).catch(()=>null);if(s&&s.status==='PAID'){ok=true;break}if(s&&s.status==='FAILED')break;await new Promise(x=>setTimeout(x,4000))}payData.ok=ok;window.umkXp=null;window.umkXpStarted=false;payStep=6;payRender()}

if(payData.ok){app.innerHTML=`<section class="success-page"><div class="check">${IC.check}</div><h1 class="title">✓ Kwishyura byagenze neza</h1><p class="sub">${payMode==='boost'?'Konti yawe izagaragara mbere y’izindi.':payMode==='roles'?'Akazi kongeweho. Ubu ubona n’abandi.':'Ubu ushobora kureba '+(role==='worker'?'akazi':'abakozi')+'.'}</p><button class="primary form-next" onclick="completePay()">${payMode==='boost'?'Subira ku mwirondoro':'Reba '+(role==='worker'?'akazi':'abakozi')}</button></section>`}
else{app.innerHTML=`<section class="success-page"><div class="check fail">✕</div><h1 class="title">✗ Kwishyura ntibyakunze</h1><p class="sub">Ongera ugerageze.</p><button class="primary form-next" onclick="payStep=1;payErr='';payRender()">Ongera ugerageze</button></section>`}}

function editProfile(u){return `<div class="form">${fieldEdit('name','Amazina',u.name,'text')}${fieldEdit('phone','Telefone',u.phone,'tel')}<div class="field"><label>Intara</label><div class="control"><select id="edit-province" onchange="fillDist(this.value)">${opts(provinces.map(p=>p[0]),provOf(u.district),'Hitamo intara')}</select></div></div><div class="field"><label>Akarere</label><div class="control"><select id="edit-district">${opts((provinces.find(p=>p[0]===provOf(u.district))||[0,[]])[1],u.district,'Hitamo akarere')}</select></div></div>${u.role==='worker'?`<div class="field"><label>Uburambe</label><div class="control"><select id="edit-detail">${opts(experiences,u.experience,'Hitamo uburambe')}</select></div></div>`:`<div class="field"><label>Ibisobanuro</label><div class="control"><textarea id="edit-detail">${esc(u.description)}</textarea></div></div>`}<div class="field"><label>Abamo cyangwa ataha</label><div class="control"><select id="edit-live">${opts(liveOpts,u.live,'Hitamo')}</select></div></div>${fieldEdit('salary','Umushahara (RWF ku kwezi)',u.salary,'number')}<button class="primary" onclick="saveProfile()">Bika impinduka</button><button class="outline" onclick="myProfile()">Reka guhindura</button><div class="status-card rolesec"><div class="status-line"><strong>${u.pay==='PAID'?'Ongeraho akazi':'Hitamo akazi'}</strong></div><p class="sub" style="margin:6px 0 14px">Ushobora guhitamo kimwe cyangwa byinshi. Wishyura igiteranyo cyabyo.</p>${rolesBlock(u)}</div></div>`}
function fieldEdit(id,label,value,type){return `<div class="field"><label>${label}</label><div class="control"><input id="edit-${id}" type="${type}" value="${esc(value)}"></div></div>`}
async function saveProfile(){const u=Store.getUser(),name=document.querySelector('#edit-name').value.trim(),phone=document.querySelector('#edit-phone').value.trim();if(!name||!phone){alert('Uzuza amazina na telefone.');return}try{if(digits9(phone)!==digits9(u.phone)){await fnCall('account',{action:'update_phone',phone})}await meApi(`profiles?id=eq.${u.id}`,{method:'PATCH',body:{name,phone,live:document.querySelector('#edit-live').value,salary:Number(document.querySelector('#edit-salary').value)||u.salary,district:document.querySelector('#edit-district').value||u.district,[u.role==='worker'?'experience':'description']:document.querySelector('#edit-detail').value}});await loadMe();myProfile()}catch(e){alert(e.status===409?'Iyi nimero isanzwe ifite indi konti.':'Ntibyashoboye kubika. Ongera ugerageze.')}}
function changeMyPhoto(input){const f=input.files&&input.files[0];if(!f)return;const u=Store.getUser();cloudUpload(f,'my-av',480).then(async url=>{if(!url)return;try{await meApi(`profiles?id=eq.${u.id}`,{method:'PATCH',body:{photo_url:url}});await loadMe();myProfile()}catch(e){alert('Ntibyashoboye kubika ifoto.')}})}
async function hideListing(skip){if(skip!==true&&!confirm('Wemeza ko ubonye? Uzavanwa ku isoko.'))return;const u=Store.getUser();try{await meApi(`profiles?id=eq.${u.id}`,{method:'PATCH',body:{status:'HIRED'}});await loadMe();myProfile()}catch(e){alert('Ntibyashoboye kubika.')}}
async function reactivate(){const u=Store.getUser();if(u&&u.pay==='PAID'&&u.status==='HIRED'){try{const r=await rpc('reopen_listing');if(r&&r.state==='free'){await refreshAll();alert('Wongeye kugaragara ku isoko, nta kwishyura.');myProfile();return}}catch(e){}}payMode='reactivate';go('/pay')}

function revealWords(){document.querySelectorAll('.land-msg,.land-tag,.land-desc').forEach(function(el){if(el.dataset.split)return;el.dataset.split='1';const t=(function(x){return window.LANG==='en'?trEn(x):x})(el.textContent.trim());el.setAttribute('aria-label',t);el.innerHTML=t.split(/\s+/).map(function(w,i){return '<span class="w" aria-hidden="true" style="--i:'+i+'">'+w+'</span>'}).join(' ')})}

/* ===== v14: market, roles, hidden contacts, follow-up, agents ===== */
async function rpc(name,args){const tk=await authToken();const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:"POST",headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+(tk||SUPABASE_ANON_KEY),"Content-Type":"application/json"},body:JSON.stringify(args||{})});const d=await r.json().catch(()=>null);if(!r.ok)throw Object.assign(new Error((d&&(d.message||d.error))||"rpc "+r.status),{status:r.status,data:d});return d}
function mapMarket(c){const cs=Array.isArray(c.categories)&&c.categories.length?c.categories:(c.category?[c.category]:[]);return{id:c.id,role:c.role,name:c.name||"",phone:"",district:c.district||"",category:c.category||cs[0]||"",cats:cs,salary:Number(c.salary)||0,live:c.live,experience:c.experience,description:c.description||"",status:"AVAILABLE",photo:c.photo_url||"",susp:false,pay:"PAID",created:0,boost:c.boost?Date.now()+864e5:0,locked:!!c.locked,hide:!!c.hide_contact,refcode:""}}
const MARKET={state:"idle",view:"",n:0,busy:false};
function marketView(){const u=ME.profile;if(u&&(u.role==="worker"||u.role==="employer"))return u.role==="worker"?"employers":"workers";return selectedRole==="employer"?"workers":"employers"}
async function loadMarket(){const v=marketView(),tok=++MARKET.n;MARKET.busy=true;MARKET.view=v;if(!REMOTE.people||MARKET.state==="idle")MARKET.state="loading";try{const rows=await withTimeout(rpc("market_list",{p_view:v,p_limit:500}),9000);if(tok!==MARKET.n)return;REMOTE.people=Array.isArray(rows)?rows.map(mapMarket):[];MARKET.state="ok"}catch(e){if(tok===MARKET.n)MARKET.state="error"}finally{if(tok===MARKET.n)MARKET.busy=false}}
function ensureMarket(){if(MARKET.busy)return;if(MARKET.state==="idle"||MARKET.view!==marketView())loadMarket().then(()=>{if(/^\/(explore|home|province)/.test(route()))render()})}
function dropMarket(){REMOTE.people=null;MARKET.state="idle";MARKET.view="";MARKET.n++;MARKET.busy=false}
let TOUCHED=0;function touchMe(){if(!Sess.get()||Date.now()-TOUCHED<6e5)return;TOUCHED=Date.now();rpc("touch_me").catch(()=>{})}
const rolesOf=u=>{const r=ME.roles;if(r&&(r.active.length||r.pending.length))return r;const c=u&&u.category?[u.category]:[];return u&&u.pay==="PAID"?{active:c,pending:[]}:{active:[],pending:c}};
const roleFee=(role,c)=>role==="worker"?(CATFEE[c]||FEE("worker")):FEE("employer");
const priceRoles=(role,cs)=>(cs||[]).reduce((s,c)=>s+roleFee(role,c),0);
const rwf=n=>Number(n).toLocaleString("en-US")+" RWF";
const catsLabel=p=>{const c=(p.cats&&p.cats.length?p.cats:[p.category]).filter(Boolean);return c.length>2?c.slice(0,2).join(" · ")+" +"+(c.length-2):c.join(" · ")};
const rolesRow=(a,l)=>`<div class="row"><span>${a}</span><strong class="chipcell">${(l||[]).filter(Boolean).map(c=>`<span class="tag">${esc(c)}</span>`).join('')||'—'}</strong></div>`;
const sc=(e,t)=>`<span aria-hidden="true">${e}</span> <span>${t}</span>`;
const roleName=r=>r==="worker"?"Umukozi":r==="employer"?"Umukoresha":"Umuhagarariye";
function guestUser(){return{role:selectedRole==="employer"?"employer":"worker",guest:true}}
function setRole(v){selectedRole=v;try{localStorage.setItem("uk.role",v)}catch(e){}}
function focusKeep(){const ae=document.activeElement;return!!(ae&&ae.closest&&ae.closest(".search"))}
function focusBack(k){if(!k)return;const i=document.querySelector(".search input");if(i){i.focus();const l=i.value.length;i.setSelectionRange(l,l)}}
function reForm(){if(route()==="/agent/new")agentNew();else signup()}

function marketTools(cats){return `<div class="search"><span>${icon.search}</span><input aria-label="Shakisha" placeholder="Shakisha..." value="${esc(filters.q)}" oninput="filters.q=this.value;rerenderList()"></div><div class="filters"><select aria-label="Akarere" onchange="filters.district=this.value;rerenderList()">${opts(districts,filters.district,'Akarere')}</select><select aria-label="Ubwoko bw’akazi" onchange="filters.category=this.value;rerenderList()">${opts(cats||categories,filters.category,'Ubwoko bw’akazi')}</select><select aria-label="Umushahara" onchange="filters.salary=this.value;rerenderList()">${opts(salaries,filters.salary,'Umushahara')}</select></div>`}
function marketBody(shown){if(shown.length)return provinces.map(provSec(shown)).join("");if(MARKET.state==="loading"||MARKET.state==="idle")return `<p class="sub" style="text-align:center;margin-top:40px">...</p>`;if(MARKET.state==="error")return `<div class="empty"><h2>Ntibyashobotse gufungura</h2><p>Reba ko ufite internet, hanyuma wongere ugerageze.</p><button class="primary" style="margin-top:14px" onclick="MARKET.state='idle';ensureMarket();render()">Ongera ugerageze</button></div>`;return `<div class="empty"><div class="illus">${IC.search}</div><h2>Nta bisubizo bibonetse</h2><p>Hindura ibyo washakishije.</p></div>`}
function guestNav(){return `<nav class="bottom-nav gnav"><button class="outline" onclick="go('/login')">${T("login","Injira")}</button><button class="primary" onclick="startSignup()">Fungura konti</button></nav>`}
function explore(){if(selectedRole!=="worker"&&selectedRole!=="employer"){go("/role");return}ensureMarket();const g=guestUser(),w=g.role==="worker",k=focusKeep(),shown=visible(g);app.innerHTML=hdr(null)+`<section class="page has-top"><div class="top">${back('/role')}<h1>${w?T('titleW','Akazi'):T('titleE','Abakozi')}</h1></div><div class="note guestnote"><b>Urimo kureba nk’umushyitsi.</b><span>Fungura konti kugira ngo ufungure umwirondoro w’uwo ushaka kandi uvugane na we.</span></div>${marketTools()}<div class="list">${marketBody(shown)}</div></section>${guestNav()}`;focusBack(k)}
function closeModal(){const m=document.getElementById("umodal");if(m)m.remove()}
function lockPrompt(){closeModal();document.body.insertAdjacentHTML("beforeend",`<div class="umodal" id="umodal" onclick="if(event.target===this)closeModal()"><div class="umbox" role="dialog" aria-modal="true"><h2>Banza ufungure konti</h2><p>Kugira ngo ubone uyu mwirondoro, ugomba kubanza gufungura konti.</p><button class="primary" onclick="closeModal();startSignup()">Fungura konti</button><button class="outline" onclick="closeModal();go('/login')">${T("login","Injira")}</button><button class="text-btn" onclick="closeModal()">Reka</button></div></div>`)}

/* ----- roles (several jobs, one total) ----- */
let rolesSel=[],rolesAvail=[];
function rolesInit(u){rolesSel=[...rolesOf(u).pending]}
function rolesBlock(u){const rl=rolesOf(u),paid=u.pay==="PAID",act=paid?rl.active:[];rolesAvail=paid?categories.filter(c=>!rl.active.includes(c)):[...categories];return `${act.length?`<div class="field"><label>${u.role==='worker'?'Akazi ukora':'Abakozi ushaka'}</label><div class="chips">${act.map(c=>`<span class="tag on">${esc(c)} ✓</span>`).join('')}</div></div>`:''}${rolesAvail.length?`<div class="field"><label>${paid?'Ongeraho akandi kazi':'Hitamo akazi'}</label><div class="rolepicks">${rolesAvail.map((c,i)=>`<label class="rolepick ${rolesSel.includes(c)?'on':''}"><input type="checkbox" ${rolesSel.includes(c)?'checked':''} onchange="toggleRole(${i},this)"><span>${esc(c)}</span><b>${rwf(roleFee(u.role,c))}</b></label>`).join('')}</div></div><div class="rtotal"><span>Uzishyura yose hamwe</span><b id="rtot">${rwf(priceRoles(u.role,rolesSel))}</b></div><button class="primary" id="rpay" ${rolesSel.length?'':'disabled'} onclick="payRoles()">${paid?'Ishyura wongereho akazi':'Komeza kwishyura'}</button>`:`<p class="sub">Ufite akazi kose kaboneka.</p>`}`}
function toggleRole(i,el){const c=rolesAvail[i],u=Store.getUser();if(!c||!u)return;const k=rolesSel.indexOf(c);if(el.checked&&k<0)rolesSel.push(c);if(!el.checked&&k>=0)rolesSel.splice(k,1);const t=document.getElementById("rtot");if(t)t.textContent=rwf(priceRoles(u.role,rolesSel));const b=document.getElementById("rpay");if(b)b.disabled=!rolesSel.length;el.closest(".rolepick").classList.toggle("on",el.checked)}
async function payRoles(){const u=Store.getUser();if(!u||!rolesSel.length)return;const btn=document.getElementById("rpay");if(btn)btn.disabled=true;try{const r=await rpc("set_pending_roles",{p_cats:rolesSel});if(!r||!r.ok)throw new Error((r&&r.error)||"fail");await loadExtras();payMode=u.pay==="PAID"?"roles":"reactivate";go("/pay")}catch(e){if(btn)btn.disabled=false;alert("Ntibyashoboye kubika akazi wahisemo. Ongera ugerageze.")}}
function rolesPage(){const u=Store.getUser();if(u.role==="agent"){go("/home");return}rolesInit(u);app.innerHTML=hdr(u)+`<section class="page has-top"><div class="top">${back('/home')}<h1>${u.pay==='PAID'?'Ongeraho akazi':'Hitamo akazi'}</h1></div><p class="sub">${u.role==='worker'?'Hitamo akazi kamwe cyangwa byinshi ushaka gukora. Wishyura igiteranyo cyabyo, hanyuma ubone abakoresha babishaka.':'Hitamo akazi kamwe cyangwa byinshi ushakira abakozi. Wishyura igiteranyo cyabyo, hanyuma ubone abakozi babikora.'}</p><div class="form" style="margin-top:18px">${rolesBlock(u)}</div></section>${nav('home',u)}`}

function pickBlock(){const sel=draftData.categories||[],role=draftData.role;return `<div class="field"><label>${role==='worker'?'Akazi ukora (hitamo kamwe cyangwa byinshi)':'Abakozi ushaka (hitamo kamwe cyangwa byinshi)'}</label><div class="rolepicks">${categories.map((c,i)=>`<label class="rolepick ${sel.includes(c)?'on':''}"><input type="checkbox" ${sel.includes(c)?'checked':''} onchange="pickCat(${i},this)"><span>${esc(c)}</span><b>${rwf(roleFee(role,c))}</b></label>`).join('')}</div>${errors.categories?`<p class="error">${errors.categories}</p>`:''}</div><div class="rtotal"><span>Uzishyura yose hamwe</span><b id="ptot">${rwf(priceRoles(role,sel))}</b></div>`}
function pickCat(i,el){const c=categories[i];if(!c)return;const a=draftData.categories=draftData.categories||[],k=a.indexOf(c);if(el.checked&&k<0)a.push(c);if(!el.checked&&k>=0)a.splice(k,1);draftData.category=a[0]||"";const t=document.getElementById("ptot");if(t)t.textContent=rwf(priceRoles(draftData.role,a));el.closest(".rolepick").classList.toggle("on",el.checked)}
const termsRow=()=>`<div class="field"><label class="termsrow"><input type="checkbox" ${draftData.terms?'checked':''} onchange="draftData.terms=this.checked"><span>Nemeye</span><a href="#/terms">amategeko n’amabwiriza</a><span>ya UMUKOZI</span></label>${errors.terms?`<p class="error">${errors.terms}</p>`:''}</div>`;

const payPurpose=()=>payMode==='boost'?'boost':payMode==='roles'?'add_roles':'activation';
const REV={};let OP={id:"",contact:""};
function contactHtml(id,st){if(st==="open"){if(REV[id])return `<div class="info"><div class="row"><span>Numero ya telefone</span><strong>${esc(REV[id])}</strong></div></div><div class="actions"><a class="button primary" href="tel:${esc(REV[id].replace(/\s/g,''))}">${IC.phone} Hamagara</a><a class="button success" href="https://wa.me/${esc(REV[id].replace(/\D/g,''))}" target="_blank" rel="noreferrer">${IC.wa} WhatsApp</a></div>`;return `<button class="primary" onclick="revealPhone('${id}')">Erekana nimero</button><p class="sub" style="margin-top:8px">Buri nimero ureba irabarwa.</p>`}if(st==="hidden")return `<div class="note">Nimero yahishwe na nyirayo. Mushobora kumusaba kuvugana.</div><button class="primary" style="margin-top:12px" onclick="askContact('${id}')">Saba kuvugana</button>`;if(st==="pending")return `<div class="note">Ubusabe bwawe bwoherejwe. Dutegereje ko abwemera.</div>`;if(st==="declined")return `<div class="note">Ubusabe bwawe ntibwemewe. Ushobora kongera kugerageza nyuma y’iminsi 7.</div>`;return ''}

function otherProfileLocal(id){const p=[...Store.getWorkers(),...Store.getEmployers()].find(x=>x.id===id);if(!p){go("/home");return}const tel=String(p.phone||"").replace(/\s/g,""),wa=tel.replace(/^\+/,"");app.innerHTML=hdr(Store.getUser())+`<section class="page has-top"><div class="top">${back('/home')}<h1>Umwirondoro</h1></div><div class="profile-head">${avatar(p,true)}<h1>${esc(p.name)}</h1><p class="sub">${p.role==='worker'?'Umukozi':'Umukoresha'} · ${esc(p.district)}</p></div><div class="info">${infoRow('Akarere',p.district)}${infoRow('Ubwoko bw’akazi',p.category)}${infoRow(p.role==='worker'?'Uburambe':'Ibisobanuro',p.role==='worker'?p.experience:p.description)}${infoRow('Numero ya telefone',p.phone)}${infoRow('Abamo cyangwa ataha',p.live)}${infoRow('Umushahara',fmt(p.salary))}</div><div class="actions"><a class="button primary" href="tel:${tel}">${IC.phone} Hamagara</a><a class="button success" href="https://wa.me/${wa}" target="_blank" rel="noreferrer">${IC.wa} WhatsApp</a></div></section>`}
function noticePage(u,title,msg,btn,fn){app.innerHTML=hdr(u)+`<section class="page has-top"><div class="top">${back('/home')}<h1>${title}</h1></div><div class="empty"><p>${msg}</p>${btn?`<button class="primary" style="margin-top:16px" onclick="${fn}">${btn}</button>`:''}</div></section>${nav('home',u)}`}
async function otherProfile(id){if(PREVIEW&&!ME.profile){otherProfileLocal(id);return}if(!UUID.test(id)){go('/home');return}const u=Store.getUser();if(!u){lockPrompt();go("/explore");return}if(u.role==="agent"){go("/home");return}app.innerHTML=hdr(u)+`<section class="page has-top"><div class="top">${back('/home')}<h1>Umwirondoro</h1></div><p class="sub" style="text-align:center;margin-top:40px">...</p></section>${nav('home',u)}`;let r=null;try{r=await rpc("market_profile",{p_id:id})}catch(e){}if(route()!=="/profile/"+id)return;if(!r){noticePage(u,"Umwirondoro","Ntibyashobotse gufungura. Ongera ugerageze.","Ongera ugerageze","render()");return}if(r.state==="login"){lockPrompt();go("/explore");return}if(r.state==="not_allowed"){noticePage(u,"Umwirondoro","Ishyura kugira ngo ubone uyu mwirondoro n’abandi.","Kwishyura","reactivate()");return}if(r.state==="gone"){noticePage(u,"Umwirondoro","Uyu mwirondoro ntukiboneka.","","");return}if(r.state==="not_your_role"){noticePage(u,"Umwirondoro","Uyu mwirondoro uri mu kazi utarimo. Ongeraho akazi kugira ngo ubone n’abandi.","Ongeraho akazi","go('/roles')");return}if(r.state!=="ok"){go("/home");return}const p=r.p,w=p.role==="worker",cs=(p.categories&&p.categories.length?p.categories:[p.category]).filter(Boolean);OP={id,contact:r.contact};app.innerHTML=hdr(u)+`<section class="page has-top"><div class="top">${back('/home')}<h1>Umwirondoro</h1></div><div class="profile-head">${avatar({name:p.name,photo:p.photo_url||''},true)}<h1>${esc(p.name)}</h1><p class="sub">${w?'Umukozi':'Umukoresha'} · ${esc(p.district)}</p></div><div class="info">${infoRow('Akarere',p.district)}${rolesRow(w?'Akazi akora':'Abakozi ashaka',cs)}${infoRow(w?'Uburambe':'Ibisobanuro',w?p.experience:p.description)}${infoRow('Abamo cyangwa ataha',p.live)}${infoRow('Umushahara',fmt(p.salary))}</div>${u.role==='employer'?`<div class="note" style="margin-top:14px">Mbere yo guha akazi umukozi, musabe ibyangombwa bye n’inimero z’abantu bamuzi. <a href="#/terms">Soma amabwiriza</a></div>`:''}<div id="ct" style="margin-top:16px">${contactHtml(id,r.contact)}</div></section>${nav('home',u)}`}
function leadsCard(){const L=ME.leads||[];if(!L.length)return "";return L.map(l=>{const o=l.other||{},cf=l.kind==="confirm";return `<div class="status-card" style="margin-top:0"><div class="status-line"><strong>${cf?esc(o.name)+' avuga ko mwumvikanye ku kazi.':'Wavuganye na '+esc(o.name)}</strong></div><p class="sub" style="margin:6px 0 12px">${cf?'Ni byo?':'Mwumvikanye ku kazi?'}</p>${cf?`<div class="btnrow"><button class="primary" onclick="answerLead('${l.id}','hired')">Yego, ni byo</button><button class="outline" onclick="answerLead('${l.id}','no')">Oya</button></div>`:`<div class="btnrow"><button class="primary" onclick="answerLead('${l.id}','hired')">Yego, twumvikanye</button><button class="outline" onclick="answerLead('${l.id}','talking')">Turacyavugana</button><button class="outline" onclick="answerLead('${l.id}','no')">Oya</button></div>`}</div>`}).join("")}
async function answerLead(id,ans){try{const r=await rpc("answer_lead",{p_lead:id,p_answer:ans});if(!r||!r.ok)throw 0;ME.leads=(ME.leads||[]).filter(x=>x.id!==id);const u=Store.getUser();if(ans==="hired"&&u&&u.status==="AVAILABLE"){rerenderMe();if(confirm("Murakoze! Ushaka ko umwirondoro wawe uvanwa ku isoko?"))await hideListing(true);return}rerenderMe()}catch(e){alert("Ntibyakunze, ongera ugerageze.")}}
function rerenderMe(){if(route()==="/home")home();else myProfile()}
function requestsCard(){const q=(ME.req||[]).filter(x=>x.status==="pending");if(!q.length)return "";return `<div class="status-card" style="margin-top:0"><div class="status-line"><strong>${sc('🔔','Abashaka kuvugana nawe')}</strong><span class="dotb">${q.length}</span></div>${q.map(x=>`<div class="reqrow"><div class="avatar">${x.photo_url?`<img src="${esc(x.photo_url)}" alt="">`:SIL}</div><div class="rq-i"><b>${esc(x.name)}</b><small><span>${roleName(x.role)}</span> · <span>${esc(x.category||'')}</span> · <span>${esc(x.district||'')}</span></small></div><div class="rq-b"><button class="small-btn" onclick="answerReq('${x.from_id}',true)">Emerera</button><button class="outline mini" onclick="answerReq('${x.from_id}',false)">Hakana</button></div></div>`).join("")}</div>`}
async function answerReq(id,yes){try{const r=await rpc("respond_request",{p_from:id,p_accept:!!yes});if(!r||!r.ok)throw 0;ME.req=(ME.req||[]).filter(x=>x.from_id!==id);if(yes)alert("Yemerewe. Ashobora kubona nimero yawe ubu.");rerenderMe()}catch(e){alert("Ntibyakunze, ongera ugerageze.")}}
function contactCard(u){if(u.pay!=="PAID")return "";return `<div class="status-card" style="margin-top:14px"><div class="status-line"><strong>${u.hide?sc('🔒','Nimero yanjye irahishe'):sc('📞','Nimero yanjye irigaragara')}</strong><button type="button" class="sw ${u.hide?'on':''}" role="switch" aria-checked="${!!u.hide}" aria-label="Hisha nimero yanjye" onclick="toggleHide()"></button></div><p class="sub" style="margin:8px 0 0">${u.hide?'Abandi ntibashobora kubona nimero yawe batayigusabye. Uzabona ubusabe hano, ukabwemera cyangwa ukabwanga.':'Abafite akazi gahuye n’akawe bashobora kubona nimero yawe. Uyihishe niba ushaka kubanza kumenya ababishaka.'}</p></div>`}
async function toggleHide(){const u=Store.getUser();try{await meApi(`profiles?id=eq.${u.id}`,{method:"PATCH",body:{hide_contact:!u.hide}});await loadMe();myProfile()}catch(e){alert("Ntibyashoboye kubika. Ongera ugerageze.")}}
/* ----- terms & policies ----- */
function termsDoc(en){return en?[["How UMUKOZI works",["UMUKOZI is a platform that connects domestic workers and employers in Rwanda. It is not an employment agency and it is not the employer of any worker. The work agreement is made between the employer and the worker themselves.","A visitor without an account can only see cards: first name, district, job and pay. Details and phone numbers stay hidden.","A worker opens an account, chooses one or more jobs they do, and pays the total. After paying, the worker sees only the employers who want those jobs. To see more, the worker adds jobs under “Edit information” and pays for the added jobs.","An employer does the same: opens an account, chooses the jobs they want workers for, pays, and sees the workers who do those jobs. More jobs can be added at any time.","Prices are shown before every payment. When you choose several jobs, you pay the total of their prices."]],["Phone numbers and privacy",["A phone number is shown only to a paying member who holds a matching job, and only after they ask to see it. Every number viewed is recorded.","Workers and employers can hide their number. When it is hidden, others can send a request; the owner sees who is asking and can accept or decline.","Do not collect numbers to use them for anything else, sell them, or send commercial messages."]],["Employers: what you must do",["Before giving someone a job, the employer must ask the worker for their documents (such as an ID card) and for the phone numbers of people who know them (for example a previous employer, a local leader or a family guarantor).","This gives extra protection if the worker later causes a problem (for example theft or disappearing). UMUKOZI does not check documents on the employer’s behalf; that responsibility belongs to the employer.","Agree on pay, working hours and rest days, and put it in writing."]],["Workers: what you must do",["Give true information, use your own photo, and do not pretend to be someone else. Be ready to show an employer your documents and the numbers of people who know you when asked.","If anyone asks you for money in UMUKOZI’s name other than the fee shown in the app, tell the administrators."]],["Knowing when a job has been found",["After you view a number, UMUKOZI will ask you after 3 days whether you agreed on the job. The other person is also asked to confirm. This keeps the market accurate and spares people from needless calls.","An account that has not been opened for 30 days is hidden from the market, and appears again as soon as you open the app, for free.","If you say you found work or a worker, you can come back to the market for free within 14 days, once every 60 days. After that you pay again as before."]],["Agents",["An agent opens accounts for people who do not have a smartphone, and helps them find a job or a worker. An agent’s own account is free; the accounts the agent opens for others are paid like any other account.","An agent must have the person’s permission, give true information and not misuse it.","An agent can enter those accounts to keep searching for the person. When the agent hands an account to its owner, a new password is created and the agent can no longer enter it.","An agent earns the normal referral reward for the people they open accounts for."]],["Sponsors (referral)",["Every paying member gets a code. When someone signs up with your code and pays, you earn a reward at the first level, and the person who invited you earns at the second level. The amounts and the minimum withdrawal are shown under “Invite a friend”. Do not open many accounts with your own code to earn rewards."]],["Not allowed",["Fake accounts, false information, harassing or threatening others, using children in ways the law forbids, and any unlawful use of the platform. The administrators may suspend any account that does this."]],["Safety tips",["Meet in a safe place before starting. Tell family or a friend where you are going. Read and write down the agreement. Do not send money before you have met."]],["Other",["UMUKOZI cannot promise that everyone will find a job or a worker. As far as the law allows, UMUKOZI is not responsible for what employers and workers agree or do outside the platform.","These terms may change. Important changes will be announced in the app.","Questions: contact the administrators through the social links in the app."]]]:[["Uko UMUKOZI ikora",["UMUKOZI ni urubuga ruhuza abakozi bo mu rugo n’abakoresha mu Rwanda. Si ikigo gitanga akazi, kandi si umukoresha w’umukozi uwo ari we wese. Amasezerano y’akazi akorwa hagati y’umukoresha n’umukozi ubwabo.","Umushyitsi utarafungura konti areba gusa amakarita: izina rya mbere, akarere, akazi n’umushahara. Ibisobanuro birambuye n’inimero za telefone ntibigaragara.","Umukozi afungura konti, agahitamo akazi kamwe cyangwa byinshi akora, akishyura igiteranyo cyabyo. Nyuma yo kwishyura abona gusa abakoresha bashaka ako kazi. Ushaka kureba abandi yongeraho akazi muri “Hindura amakuru”, akishyura akazi yongeyeho.","Umukoresha na we afungura konti, agahitamo akazi k’abakozi ashaka, akishyura, akabona abakozi bakora ako kazi. Ashobora kongeraho akandi kazi igihe cyose.","Ibiciro bigaragara mbere ya buri bwishyu. Iyo uhisemo akazi kenshi, wishyura igiteranyo cy’ibiciro byako."]],["Nimero za telefone n’ibanga",["Nimero ya telefone igaragara gusa ku munyamuryango wishyuye ufite akazi gahuye, kandi nyuma yo kuyisaba akayerekanirwa. Buri nimero irebwe iranditswa.","Abakozi n’abakoresha bashobora guhisha nimero zabo. Iyo nimero ihishwe, undi ashobora kohereza ubusabe; nyirayo abona uwabusabye, akabwemera cyangwa akabwanga.","Ntibyemewe gukusanya nimero ngo uzikoreshe ukundi, kuzigurisha, cyangwa kohereza ubutumwa bw’ubucuruzi."]],["Abakoresha: ibyo musabwa",["Mbere yo guha umuntu akazi, umukoresha asabwa kwisabira umukozi ibyangombwa bye (nk’indangamuntu) n’inimero za telefone z’abantu bamuzi (urugero uwo yakoreye mbere, umuyobozi w’aho atuye, cyangwa uwamuhagarariye mu muryango).","Ibi byongera uburinzi igihe umukozi aje guteza ikibazo (urugero kwiba cyangwa gutoroka). UMUKOZI ntisuzuma ibyangombwa mu cyimbo cy’umukoresha; iyo nshingano ni iy’umukoresha.","Muvugane ku mushahara, amasaha y’akazi n’iminsi y’ikiruhuko, mubyandike."]],["Abakozi: ibyo musabwa",["Mutange amakuru y’ukuri, mukoreshe ifoto yanyu bwite, kandi mutiyitirira abandi. Mwemere kwereka umukoresha ibyangombwa byanyu n’inimero z’abantu babazi igihe babisabwe.","Nihagira ukwaka amafaranga ku izina rya UMUKOZI atari ayo wishyura muri app, ubimenyeshe ubuyobozi."]],["Kumenya ko akazi kabonetse",["Nyuma yo kureba nimero, UMUKOZI izakubaza nyuma y’iminsi 3 niba mwumvikanye ku kazi. Undi muntu na we abazwa kubyemeza. Ibi bituma isoko riba ryizewe kandi bikarinda abantu guhamagarwa nta mpamvu.","Konti itafunguwe mu minsi 30 ihishwa ku isoko, igaragara ako kanya wongeye gufungura app, nta kiguzi.","Niba uvuze ko wabonye akazi cyangwa umukozi, ushobora kongera kugaragara ku isoko ku buntu mu minsi 14, rimwe mu minsi 60. Nyuma yaho wishyura nk’uko byari bisanzwe."]],["Abahagarariye (Agents)",["Umuhagarariye afungurira konti abantu badafite telefone zigezweho, akabafasha gushaka akazi cyangwa umukozi. Konti y’umuhagarariye ubwe ni ubuntu; konti afungurira abandi zishyurwa nk’izindi zose.","Umuhagarariye asabwa kubanza kubona uburenganzira bw’uwo afungurira konti, gutanga amakuru y’ukuri no kutayakoresha nabi.","Umuhagarariye ashobora kwinjira muri izo konti agakomeza gushakira uwo muntu akazi. Iyo atanze konti ku nyirayo, ahabwa ijambo ry’ibanga rishya, kandi umuhagarariye ntashobora kongera kuyinjiramo.","Umuhagarariye abona igihembo cy’abatumira nk’abandi ku bantu yafunguriye konti."]],["Abatumira (Sponsors)",["Buri munyamuryango wishyuye ahabwa kode. Iyo hari uwiyandikishije akoresheje kode yawe akishyura, wunguka igihembo ku rwego rwa mbere, n’uwagutumiye akunguka ku rwego rwa kabiri. Amafaranga n’umubare muto wo kubikuza bigaragara muri “Tumira inshuti”. Ntukore konti nyinshi ukoresheje kode yawe ushaka ibihembo."]],["Ibibujijwe",["Konti z’impimbano, amakuru y’ibinyoma, guhohotera cyangwa gutera ubwoba abandi, gukoresha abana mu buryo amategeko abuza, no gukoresha urubuga mu buryo bunyuranyije n’amategeko. Ubuyobozi bushobora guhagarika konti iyo ari yo yose ikoze ibyo."]],["Inama z’umutekano",["Muhurire ahantu hizewe mbere yo gutangira. Menyesha umuryango cyangwa inshuti aho ugiye. Soma kandi wandike amasezerano. Ntukohereze amafaranga mbere y’uko mubonana."]],["Ibindi",["UMUKOZI ntishobora kwemeza ko buri wese azabona akazi cyangwa umukozi. Uko amategeko abyemera, UMUKOZI ntiryozwa ibyo abakoresha n’abakozi bumvikanyeho cyangwa bakoze hanze y’urubuga.","Aya mabwiriza ashobora guhinduka. Impinduka zikomeye zizamenyeshwa muri app.","Ibibazo: vugana n’ubuyobozi unyuze ku mbuga nkoranyambaga ziri muri app."]]]}
function termsPage(){const en=window.LANG==="en",d=termsDoc(en);app.innerHTML=`<section class="page terms"><div class="top">${back(/^\/[\w\/-]*$/.test(PREV)&&PREV!=='/terms'&&!PREV.startsWith('/admin')?PREV:'/')}<h1>${en?'Terms & policies':'Amategeko n’amabwiriza'}</h1></div><p class="sub">${en?'Version 1 · November 2026':'Verisiyo ya 1 · Ugushyingo 2026'}</p>${d.map(s=>`<h2>${s[0]}</h2>${s[1].map(p=>`<p>${p}</p>`).join('')}`).join('')}${socHtml()}</section>`}

/* ----- agents ----- */
const AG={list:null,err:false,busy:false,made:null,given:null};
const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function goNow(p){if(route()===p)render();else go(p)}
async function loadAgentList(){const u=Store.getUser();AG.busy=true;try{AG.list=await meApi(`profiles?managed_by=eq.${u.id}&select=id,name,phone,role,category,status,pay_status,suspended,district,photo_url,created_at&order=created_at.desc&limit=300`);AG.err=false}catch(e){AG.err=true;if(!AG.list)AG.list=[]}finally{AG.busy=false}}
function agentRow(a){const w=a.role==="worker",paid=a.pay_status==="PAID",st=a.suspended?"Yahagaritswe":!paid?"Itarishyura":a.status==="AVAILABLE"?(w?"Arashaka akazi":"Arashaka umukozi"):(w?"Afite akazi":"Yabonye umukozi");return `<div class="status-card accrow"><div class="acc-top"><div class="avatar">${a.photo_url?`<img src="${esc(a.photo_url)}" alt="">`:SIL}</div><div class="rq-i"><b>${esc(a.name)}</b><small><span>${roleName(a.role)}</span> · <span>${esc(a.category||'')}</span> · <span>${esc(a.district||'')}</span></small><small>${esc(a.phone||'')}</small></div><span class="tag ${paid&&!a.suspended?'':'tag-p'}">${st}</span></div><div class="btnrow" style="margin-top:12px">${a.suspended?'':`<button class="primary" onclick="enterAccount('${a.id}','${paid?'/home':'/profile'}')">Injira muri konti</button>`}<button class="outline" onclick="go('/agent/give/${a.id}')">Tanga konti</button></div></div>`}
function agentHome(){const u=Store.getUser();if(u.role!=='agent'){go('/home');return}if(AG.list===null&&!AG.busy)loadAgentList().then(()=>{if(route()==="/home"||route()==="/agent")agentHome()});const L=AG.list||[];app.innerHTML=hdr(u)+`<section class="page has-top"><h1 class="ptitle">Konti nitaho</h1><p class="sub">Fungurira konti abantu badafite telefone, ubashakire akazi cyangwa umukozi.</p><button class="primary" style="margin:16px 0" onclick="agentStart()">+ Fungura konti nshya</button>${AG.err?`<div class="note" style="margin-bottom:12px">Ntibyashobotse gufungura urutonde. <a href="#/home" onclick="AG.list=null;agentHome();return false">Ongera ugerageze</a></div>`:''}${L.length?L.map(agentRow).join(''):(AG.list===null?'<p class="sub" style="text-align:center">...</p>':'<div class="empty"><h2>Nta konti urafungura</h2><p>Konti ufunguye zizagaragara hano.</p></div>')}${refCard(u)}</section>${nav('home',u)}`}
function agentStart(){draftData={role:"worker",status:"AVAILABLE",photo:"",categories:[],terms:true};errors={};AG.made=null;go("/agent/new")}
function agentNew(){const u=Store.getUser();if(!u||u.role!=="agent"){go("/home");return}if(!draftData.role||draftData.role==="agent"){agentStart();return}const w=draftData.role==="worker";app.innerHTML=hdr(u)+`<section class="page has-top"><div class="top">${back('/home')}<h1>Konti nshya</h1></div><div class="form"><div class="seg"><button class="${w?'on':''}" onclick="draftData.role='worker';draftData.categories=[];agentNew()">Umukozi</button><button class="${!w?'on':''}" onclick="draftData.role='employer';draftData.categories=[];agentNew()">Umukoresha</button></div>${field('name','Amazina y’uwo ufungurira','Andika amazina','text',IC.user)}${field('phone','Numero ya telefone ye','+250 78...','tel',IC.phone)}${field('email','Email (si ngombwa)','wewe@example.com','email',IC.user)}${provField()}${distField()}${pickBlock()}${w?selectField('experience','Uburambe',experiences,'Hitamo uburambe',IC.clock):textArea('description','Ibisobanuro by’akazi','Sobanura akazi muri make')}${selectField('live',w?'Abamo cyangwa ataha':'Ushaka umukozi abamo cyangwa ataha',liveOpts,'Hitamo',IC.home)}${field('salary',w?'Umushahara yifuza (RWF ku kwezi)':'Umushahara atanga (RWF ku kwezi)','Urugero: 60000','number',IC.brief)}${field('password','Ijambo ry’ibanga (si ngombwa)','••••','password',IC.lock)}<div class="photo-box">${avatar({name:draftData.name||'Umukozi',photo:draftData.photo},true,'pb-av')}<label class="upload">Hitamo ifoto<input type="file" accept="image/*" onchange="readPhoto(this)"></label></div><p class="sub">Niba utashyizeho ijambo ry’ibanga, tuzaritanga, urikwereke nyiri konti.</p><button class="primary form-next" onclick="agentSubmit()">Fungura konti</button></div></section>${nav('home',u)}`}
async function agentSubmit(){errors={};const d=draftData,w=d.role==="worker",req="Uzuza aha mbere yo gukomeza.";["name","phone","province","district","live"].forEach(k=>{if(!String(d[k]||"").trim())errors[k]=req});if(!(d.categories&&d.categories.length))errors.categories="Hitamo nibura akazi kamwe.";if(w&&!d.experience)errors.experience=req;if(!w&&!String(d.description||"").trim())errors.description=req;if(d.phone&&!/^\+?250\s?7\d{8}$/.test(String(d.phone).replace(/\s/g,"")))errors.phone="Andika numero itangirwa na +250 7.";if(!(Number(d.salary)>0))errors.salary="Andika umubare w’amafaranga.";const em=String(d.email||"").trim();if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))errors.email="Andika email yemewe, urugero wewe@example.com.";if(d.password&&d.password.length<6)errors.password="Nibura inyuguti 6.";if(Object.keys(errors).length){agentNew();return}const btn=event&&event.target;if(btn)btn.disabled=true;try{const pr={role:d.role,name:d.name,phone:d.phone,email:em,district:d.district,categories:d.categories,category:d.categories[0],salary:Number(d.salary)||0,live:d.live,photo_url:d.photo||""};if(w)pr.experience=d.experience;else pr.description=d.description;const res=await fnCall("account",{action:"agent_create",profile:pr,password:d.password||""});AG.made={profile:res.profile,password:res.password||null};AG.list=null;draftData={};go("/agent/made")}catch(e){if(btn)btn.disabled=false;const M={phone_exists:"Iyi nimero isanzwe ifite konti.",bad_phone:"Numero ya telefone ntabwo ikwiye.",bad_name:"Amazina ntabwo akwiye.",bad_email:"Email ntabwo ikwiye.",bad_district:"Hitamo akarere.",bad_category:"Hitamo akazi.",bad_password:"Ijambo ry’ibanga rigomba kuba nibura inyuguti 6.",too_many_accounts:"Wageze ku mubare ntarengwa wa konti (300).",not_agent:"Konti yawe si iy’umuhagarariye."};alert(M[e.message]||"Ntibyashobotse gufungura konti. Ongera ugerageze.")}}
function agentMade(){const u=Store.getUser(),m=AG.made;if(u.role!=='agent'||!m){go("/home");return}app.innerHTML=hdr(u)+`<section class="page has-top"><div class="top">${back('/home')}<h1>Konti yafunguwe</h1></div><div class="pay-card"><span class="badge">✓</span><p class="section-label">${esc(m.profile.name)}</p><div class="amount" style="letter-spacing:2px;font-size:28px">${esc(m.password||'••••')}</div><p class="sub">${m.password?'Iri ni ijambo ry’ibanga. Ryandike cyangwa ribwire nyiri konti: ntirizongera kugaragara.':'Wishyiriyeho ijambo ry’ibanga wowe ubwawe.'}</p></div><p class="sub" style="margin:14px 0">Numero yo kwinjiriraho: <b>${esc(m.profile.phone)}</b></p><button class="primary" onclick="enterAccount('${m.profile.id}','/profile')">Injira muri konti, wishyure</button><button class="outline" style="margin-top:10px" onclick="AG.made=null;go('/home')">Subira ku rutonde</button></section>${nav('home',u)}`}
async function enterAccount(id,to){if(!confirm("Ugiye kwinjira muri konti y’uyu muntu. Ibyo ukora byose bizabarwa nk’ibye. Komeza?"))return;try{const res=await fnCall("account",{action:"agent_enter",profile_id:id});const cur=Sess.get();if(cur){try{localStorage.setItem("uk.sess.agent",JSON.stringify(cur))}catch(e){}}Sess.set({access_token:res.session.access_token,refresh_token:res.session.refresh_token,expires_at:res.session.expires_at,user_id:res.session.user.id});dropMarket();ME.roles=null;ME.req=[];ME.leads=[];filters={q:"",district:"",category:"",salary:""};await refreshAll();goNow(to||"/home")}catch(e){alert("Ntibyashoboye kwinjira muri iyi konti. Ongera ugerageze.")}}
async function exitAccount(){let s=null;try{s=JSON.parse(localStorage.getItem("uk.sess.agent"))}catch(e){}if(!s)return;Sess.set(s);try{localStorage.removeItem("uk.sess.agent")}catch(e){}ME.profile=null;ME.roles=null;ME.req=[];ME.leads=[];dropMarket();AG.list=null;filters={q:"",district:"",category:"",salary:""};await refreshAll();goNow("/home")}
function agentBar(){let b=document.getElementById("agbar"),raw=null;try{raw=localStorage.getItem("uk.sess.agent")}catch(e){}if(!raw||!ME.profile){if(b)b.remove();return}if(!b){document.body.insertAdjacentHTML("beforeend",'<div class="agbar" id="agbar"></div>');b=document.getElementById("agbar")}b.innerHTML=`<span>Uri muri konti ya <b>${esc(ME.profile.name)}</b></span><button onclick="exitAccount()">Subira kuri konti yawe</button>`}
function agentGive(id){const u=Store.getUser();if(u.role!=='agent'||!UUID.test(id)){go("/home");return}const g=AG.given;if(g&&g.id===id){app.innerHTML=hdr(u)+`<section class="page has-top"><div class="top">${back('/home')}<h1>Konti yatanzwe</h1></div><div class="pay-card"><span class="badge">✓</span><p class="section-label">${esc(g.name)}</p><div class="amount" style="letter-spacing:2px;font-size:28px">${esc(g.password)}</div><p class="sub">Iri ni ijambo ry’ibanga rishya. Ribwire nyiri konti ubu, ntirizongera kugaragara.</p></div><p class="sub" style="margin:14px 0">Numero yo kwinjiriraho: <b>${esc(g.phone)}</b></p><div class="note">Ntushobora kongera kwinjira muri iyi konti.</div><button class="primary" style="margin-top:14px" onclick="AG.given=null;go('/home')">Subira ku rutonde</button></section>${nav('home',u)}`;return}if(AG.list===null){loadAgentList().then(()=>{if(route()==="/agent/give/"+id)agentGive(id)});app.innerHTML=hdr(u)+`<section class="page has-top"><p class="sub" style="text-align:center;margin-top:40px">...</p></section>${nav('home',u)}`;return}const a=AG.list.find(x=>x.id===id);if(!a){go("/home");return}app.innerHTML=hdr(u)+`<section class="page has-top"><div class="top">${back('/home')}<h1>Tanga konti</h1></div><div class="info"><div class="row"><span>Amazina</span><strong>${esc(a.name)}</strong></div><div class="row"><span>Telefone</span><strong>${esc(a.phone||'')}</strong></div></div><div class="note" style="margin-top:14px">Uhaye nyiri konti ijambo ry’ibanga rishya. Nyuma yaho ntuzongera kwinjira muri iyi konti.</div><div class="form" style="margin-top:14px"><div class="field"><label>Ijambo ry’ibanga rishya (si ngombwa)</label><div class="control"><span>${IC.lock}</span><input id="give-pw" type="text" placeholder="Nibura inyuguti 6" autocomplete="off"></div></div><button class="primary" onclick="agentRelease('${a.id}')">Tanga konti</button></div></section>${nav('home',u)}`}
async function agentRelease(id){const a=(AG.list||[]).find(x=>x.id===id);if(!a)return;const pw=(document.getElementById("give-pw")||{}).value||"";if(pw&&pw.length<6){alert("Ijambo ry’ibanga rigomba kuba nibura inyuguti 6.");return}if(!confirm("Wemeza ko utanze iyi konti? Ntuzongera kuyinjiramo."))return;try{const r=await fnCall("account",{action:"agent_release",profile_id:id,password:pw});AG.given={id,name:a.name,phone:r.phone||a.phone,password:r.password};AG.list=null;agentGive(id)}catch(e){alert("Ntibyakunze. Ongera ugerageze.")}}
function agentProfile(){const u=Store.getUser();app.innerHTML=hdr(u)+`<section class="page has-top"><h1 class="ptitle">Umwirondoro</h1><div class="profile-head">${avatar(u,true)}<h1>${esc(u.name)}</h1><p class="sub"><span>Umuhagarariye</span> · <span>${esc(u.district)}</span></p></div><div class="info">${infoRow('Amazina',u.name)}${infoRow('Telefone',u.phone)}${infoRow('Akarere',u.district)}</div>${refCard(u)}<a class="text-btn tlink" href="#/terms">Amategeko n’amabwiriza</a><button class="danger" onclick="logout()">Sohoka</button></section>${nav('profile',u)}`}

window.addEventListener('hashchange',render);Store.load();render();loadRemote().then(render);loadMe().then(()=>{touchMe();if(Sess.get())return loadMarket()}).then(render);document.addEventListener('visibilitychange',()=>{if(!document.hidden){refreshCfg();touchMe()}});
(function(){let d=null;document.addEventListener('pointerdown',e=>{const r=e.target.closest&&e.target.closest('.hrow');if(!r||e.pointerType!=='mouse')return;d={r,x:e.clientX,l:r.scrollLeft,m:false};r.style.scrollSnapType='none';r.style.scrollBehavior='auto'});document.addEventListener('pointermove',e=>{if(!d)return;const dx=e.clientX-d.x;if(Math.abs(dx)>4)d.m=true;d.r.scrollLeft=d.l-dx});const end=()=>{if(!d)return;d.r.style.scrollSnapType='';d.r.style.scrollBehavior='';setTimeout(()=>{d=null},0)};document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);document.addEventListener('click',e=>{if(d&&d.m){e.stopPropagation();e.preventDefault()}},true)})();
</script></body></html>

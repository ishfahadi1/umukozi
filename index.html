function pay(){if(window.umkResume){if(!window.umkStarted){window.umkStarted=true;resumeHosted(window.umkResume)}return}const u=Store.getUser(),d=Store.getDraft();const role=(payMode==='reactivate'||payMode==='boost')&&u?u.role:(d||draftData||{}).role;if(!role){go('/');return}payStep=1;payErr='';payData={role,provider:'',days:boostDays,amount:payMode==='boost'?Number(boostPrices()[boostDays]):feeFor(role,(payMode==='reactivate'?u:(d||draftData||{})).category),phone:((payMode==='reactivate'||payMode==='boost')?(u&&u.phone):(d&&d.phone))||''};payRender()}

function simulateMomoPush(phone,provider,amount){
  const wait=new Promise(r=>setTimeout(r,4000));
  return Promise.all([fnCall('pay',payMode==='boost'?{action:'boost',days:payData.days,provider,phone}:{provider,phone}),wait]).then(async function(arr){
    const res=arr[0];
    payData.payId=res.payment_id||null;
    if(res.status==='PAID')return true;
    if(res.status==='FAILED'){payData.err=res.error||'';return false}
    if(res.status==='PENDING'){payData.pending=true;return await pollPayment(res.payment_id)}
    return false;
  }).catch(function(e){payData.err=e.message;return false});
}
async function pollPayment(id){
  for(let i=0;i<40;i++){
    await new Promise(function(r){setTimeout(r,3000)});
    try{const st=await fnCall('pay',{action:'check',payment_id:id});if(st.status==='PAID')return true;if(st.status==='FAILED')return false}catch(e){}
  }
  return false;
}
function payStep4(){payStep=4;payRender();setTimeout(()=>{payStep=5;payRender();simulateMomoPush(payData.phone,payData.provider,FEE(payData.role)).then(ok=>{payData.ok=ok;payStep=6;payRender()})},3000)}

function home(){const u=Store.getUser(),ae=document.activeElement,keep=ae&&ae.closest&&ae.closest('.search');const shown=visible(u);app.innerHTML=hdr(u)+`<section class="page has-top"><h1 class="ptitle">${u.role==='worker'?T('titleW','Akazi'):T('titleE','Abakozi')}</h1><div class="search"><span>${icon.search}</span><input aria-label="Shakisha" placeholder="Shakisha..." value="${esc(filters.q)}" oninput="filters.q=this.value;home()"></div><div class="filters"><select aria-label="Akarere" onchange="filters.district=this.value;home()">${opts(districts,filters.district,'Akarere')}</select><select aria-label="Ubwoko bw’akazi" onchange="filters.category=this.value;home()">${opts(categories,filters.category,'Ubwoko bw’akazi')}</select><select aria-label="Umushahara" onchange="filters.salary=this.value;home()">${opts(salaries,filters.salary,'Umushahara')}</select></div><div class="list">${shown.length?provinces.map(provSec(shown)).join(''):`<div class="empty"><div class="illus">${IC.search}</div><h2>Nta bisubizo bibonetse</h2><p>Hindura ibyo washakishije.</p></div>`}</div></section>${nav('home',u)}`;if(keep){const i=document.querySelector('.search input');if(i){i.focus();const l=i.value.length;i.setSelectionRange(l,l)}}}
function card(p){const w=p.role==='worker';return `<article class="card" onclick="go('/profile/${p.id}')"><div class="ph">${p.photo?`<img src="${p.photo}" alt="Ifoto ya ${esc(p.name)}">`:SIL}</div><div class="ci"><h2>${w?esc(p.name):esc(p.category)}</h2><div class="meta">${esc(p.district)} · ${w?esc(p.category):esc(p.name)}</div><div class="tags">${(p.boost||0)>Date.now()?'<span class="tag" style="background:#fff3c4;color:#8a5a00">⚡ Boost</span>':''}${w?`<span class="tag">${esc(p.experience)}</span>`:''}<span class="tag">${esc(p.live||'Ataha')}</span></div><div class="salary">${fmt(p.salary)}</div><button class="small-btn" onclick="event.stopPropagation();go('/profile/${p.id}')">${w?T('give','Tanga akazi'):T('apply','Saba')}</button></div></article>`}
function otherProfile(id){const p=[...Store.getWorkers(),...Store.getEmployers()].find(x=>x.id===id);if(!p){go('/home');return}const tel=p.phone.replace(/\s/g,'');const wa=tel.replace(/^\+/,"");app.innerHTML=hdr(Store.getUser())+`<section class="page has-top"><div class="top">${back('/home')}<h1>Umwirondoro</h1></div><div class="profile-head">${avatar(p,true)}<h1>${esc(p.name)}</h1><p class="sub">${p.role==='worker'?'Umukozi':'Umukoresha'} · ${esc(p.district)}</p></div><div class="info">${infoRow('Akarere',p.district)}${infoRow('Ubwoko bw’akazi',p.category)}${infoRow(p.role==='worker'?'Uburambe':'Ibisobanuro',p.role==='worker'?p.experience:p.description)}${infoRow('Numero ya telefone',p.phone)}${infoRow('Abamo cyangwa ataha',p.live)}${infoRow('Umushahara',fmt(p.salary))}</div><div class="actions"><a class="button primary" href="tel:${tel}">${IC.phone} Hamagara</a><a class="button success" href="https://wa.me/${wa}" target="_blank" rel="noreferrer">${IC.wa} WhatsApp</a></div></section>`}
const infoRow=(a,b)=>`<div class="row"><span>${a}</span><strong>${esc(b||'—')}</strong></div>`;

const fmtD=t=>new Date(t).toLocaleDateString('rw-RW',{day:'numeric',month:'short',year:'numeric'});
function boostCard(u){if(u.pay!=='PAID'||u.status!=='AVAILABLE')return '';const on=(u.boost||0)>Date.now();return `<div class="status-card" style="margin-top:14px"><div class="status-line"><strong>⚡ Boost</strong></div><p class="sub" style="margin:6px 0 12px">${on?'Boost ikora kugeza '+fmtD(u.boost)+'.':'Zamura konti yawe igaragare mbere y’izindi.'}</p><button class="outline" onclick="go('/boost')">${on?'Ongera igihe':'Zamura konti yanjye'}</button></div>`}
function refCard(u){if(u.pay!=='PAID')return '';return `<div class="status-card" style="margin-top:14px"><div class="status-line"><strong>🎁 Tumira inshuti, wunguke</strong></div><p class="sub" style="margin:6px 0 12px">Ubona amafaranga buri wese wishyuye abikesheje kode yawe.</p><button class="outline" onclick="go('/referral')">Reba kode yanjye</button></div>`}
function boostPage(){const u=Store.getUser(),pr=boostPrices(),lab={"2":'Iminsi 2',"7":'Icyumweru (iminsi 7)',"30":'Ukwezi (iminsi 30)'};app.innerHTML=`<section class="page"><div class="top">${back('/profile')}<h1>Zamura konti yawe</h1></div><p class="sub">Konti yawe izajya igaragara mbere y’izindi muri lisiti.</p><div class="momo-opts" style="flex-direction:column;margin-top:18px">${Object.keys(pr).sort((a,b)=>a-b).map(k=>`<button class="momo-opt ${String(boostDays)===k?'on':''}" onclick="boostDays=${k};boostPage()"><b>${lab[k]||k+' iminsi'}</b><span style="margin-left:auto;font-weight:800">${Number(pr[k]).toLocaleString('en-US')} RWF</span></button>`).join('')}</div><button class="primary form-next" onclick="payMode='boost';go('/pay')">Komeza kwishyura</button></section>${nav('profile',u)}`}
let REF=null;
async function referralPage(){const u=Store.getUser();app.innerHTML=`<section class="page"><div class="top">${back('/profile')}<h1>Tumira inshuti</h1></div><p class="sub">...</p></section>${nav('profile',u)}`;try{REF=await fnCall('referral',{})}catch(e){REF=null}refRender()}
function refRender(){const u=Store.getUser();if(!REF){app.innerHTML=`<section class="page"><div class="top">${back('/profile')}<h1>Tumira inshuti</h1></div><p class="sub">Ntibyashobotse gufungura. Ongera ugerageze.</p></section>${nav('profile',u)}`;return}const link=location.origin+location.pathname+'?ref='+REF.code,msg=encodeURIComponent('Iyandikishe kuri UMUKOZI ukoresheje kode yanjye '+REF.code+': '+link),f=n=>Number(n).toLocaleString('en-US');app.innerHTML=`<section class="page"><div class="top">${back('/profile')}<h1>Tumira inshuti</h1></div><div class="pay-card"><p class="section-label">Kode yawe</p><div class="amount" style="letter-spacing:3px">${esc(REF.code)}</div><p class="sub">Uwa mbere yishyuye: ${f(REF.l1)} RWF · uwa kabiri (uwo yatumiye): ${f(REF.l2)} RWF.</p></div><a class="button primary" style="margin-top:14px;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=${msg}">Ohereza kuri WhatsApp</a><button class="outline" style="margin-top:10px" onclick="navigator.clipboard&&navigator.clipboard.writeText('${link}').then(()=>alert('Link yakopiwe'))">Kopiya link</button><div class="info" style="margin-top:18px"><div class="ir"><span>Abo watumiye</span><span>${REF.direct}</span></div><div class="ir"><span>Wunguye yose</span><span>${f(REF.earned)} RWF</span></div><div class="ir"><span>Wamaze kubikuza</span><span>${f(REF.paid_out)} RWF</span></div><div class="ir"><span>Ushobora kubikuza</span><span><b>${f(REF.balance)} RWF</b></span></div></div>${REF.balance>=REF.min_payout?`<div class="field" style="margin-top:16px"><label>Bikuza kuri</label><div class="control"><select id="wd-pv"><option value="mtn">MTN MoMo</option><option value="airtel">Airtel Money</option></select></div></div><div class="field"><label>Nimero ya telefone</label><div class="control"><input id="wd-ph" type="tel" value="${esc(u.phone||'')}"></div></div><button class="primary form-next" onclick="withdrawRef()">Bikuza ${f(REF.balance)} RWF</button>`:`<p class="sub" style="margin-top:14px">Ushobora kubikuza nibura ${f(REF.min_payout)} RWF.</p>`}</section>${nav('profile',u)}`}
async function withdrawRef(){const provider=document.getElementById('wd-pv').value,phone=document.getElementById('wd-ph').value;try{await fnCall('referral',{action:'withdraw',provider,phone});alert('Ubusabe bwoherejwe. Uzahabwa amafaranga vuba.');referralPage()}catch(e){alert(e.message==='phone_provider_mismatch'?'Nimero ntihuye n’uburyo wahisemo.':'Ntibyakunze. Ongera ugerageze.')}}
function myProfile(edit=false){const u=Store.getUser();app.innerHTML=hdr(u)+`<section class="page has-top"><h1 class="ptitle">Umwirondoro</h1><div class="profile-head">${avatar(u,true,'my-av')}<h1>${esc(u.name)}</h1><p class="sub">${u.role==='worker'?'Umukozi':'Umukoresha'} · ${esc(u.district)}</p><label class="upload">Hindura ifoto<input type="file" accept="image/*" onchange="changeMyPhoto(this)"></label></div>${edit?editProfile(u):`<div class="edit-bar"><button class="text-btn" onclick="myProfile(true)">Hindura amakuru</button></div><div class="info">${infoRow('Amazina',u.name)}${infoRow('Telefone',u.phone)}${infoRow('Akarere',u.district)}${infoRow('Ubwoko bw’akazi',u.category)}${infoRow(u.role==='worker'?'Uburambe':'Ibisobanuro',u.role==='worker'?u.experience:u.description)}${infoRow('Abamo cyangwa ataha',u.live)}${infoRow('Umushahara',fmt(u.salary))}</div>`}${u.pay==='PAID'?`<div class="status-card"><div class="status-line"><strong><span class="dot ${u.status==='AVAILABLE'?'':'off'}"></span>${u.status==='AVAILABLE'?(u.role==='worker'?'Nshaka akazi':'Nshaka umukozi'):(u.role==='worker'?'Mfite akazi':'Nabonye umukozi')}</strong></div>${u.status==='AVAILABLE'?`<button class="outline" onclick="hideListing()">${u.role==='worker'?'Mfite akazi':'Nabonye umukozi'}</button>`:`<button class="primary" onclick="reactivate()">${u.role==='worker'?'Subira gushaka akazi':'Subira gushaka umukozi'}</button>`}</div>`:`<div class="status-card"><div class="status-line"><strong>⏳ Konti yawe ntiragaragara</strong></div><p class="sub" style="margin:6px 0 12px">Wishyure kugira ngo umwirondoro wawe ugaragare ku isoko.</p><button class="primary" onclick="reactivate()">Kwishyura</button></div>`}${boostCard(u)}${refCard(u)}<button class="danger" onclick="logout()">Sohoka</button></section>${nav('profile',u)}`}
function editProfile(u){return `<div class="form">${fieldEdit('name','Amazina',u.name,'text')}${fieldEdit('phone','Telefone',u.phone,'tel')}<div class="field"><label>Intara</label><div class="control"><select id="edit-province" onchange="fillDist(this.value)">${opts(provinces.map(p=>p[0]),provOf(u.district),'Hitamo intara')}</select></div></div><div class="field"><label>Akarere</label><div class="control"><select id="edit-district">${opts((provinces.find(p=>p[0]===provOf(u.district))||[0,[]])[1],u.district,'Hitamo akarere')}</select></div></div><div class="field"><label>Ubwoko bw’akazi</label><div class="control"><select id="edit-category">${opts(categories,u.category,'Hitamo akazi')}</select></div></div>${u.role==='worker'?`<div class="field"><label>Uburambe</label><div class="control"><select id="edit-detail">${opts(experiences,u.experience,'Hitamo uburambe')}</select></div></div>`:`<div class="field"><label>Ibisobanuro</label><div class="control"><textarea id="edit-detail">${esc(u.description)}</textarea></div></div>`}<div class="field"><label>Abamo cyangwa ataha</label><div class="control"><select id="edit-live">${opts(liveOpts,u.live,'Hitamo')}</select></div></div>${fieldEdit('salary','Umushahara (RWF ku kwezi)',u.salary,'number')}<button class="primary" onclick="saveProfile()">Bika impinduka</button><button class="outline" onclick="myProfile()">Reka guhindura</button></div>`}
function fieldEdit(id,label,value,type){return `<div class="field"><label>${label}</label><div class="control"><input id="edit-${id}" type="${type}" value="${esc(value)}"></div></div>`}
async function saveProfile(){const u=Store.getUser(),name=document.querySelector('#edit-name').value.trim(),phone=document.querySelector('#edit-phone').value.trim();if(!name||!phone){alert('Uzuza amazina na telefone.');return}try{if(digits9(phone)!==digits9(u.phone)){await fnCall('account',{action:'update_phone',phone})}await meApi(`profiles?id=eq.${u.id}`,{method:'PATCH',body:{name,phone,live:document.querySelector('#edit-live').value,salary:Number(document.querySelector('#edit-salary').value)||u.salary,district:document.querySelector('#edit-district').value||u.district,category:document.querySelector('#edit-category').value,[u.role==='worker'?'experience':'description']:document.querySelector('#edit-detail').value}});await loadMe();myProfile()}catch(e){alert(e.status===409?'Iyi nimero isanzwe ifite indi konti.':'Ntibyashoboye kubika. Ongera ugerageze.')}}
function changeMyPhoto(input){const f=input.files&&input.files[0];if(!f)return;const u=Store.getUser();cloudUpload(f,'my-av',480).then(async url=>{if(!url)return;try{await meApi(`profiles?id=eq.${u.id}`,{method:'PATCH',body:{photo_url:url}});await loadMe();myProfile()}catch(e){alert('Ntibyashoboye kubika ifoto.')}})}
async function hideListing(){if(!confirm('Wemeza ko ubonye? Uzavanwa ku isoko.'))return;const u=Store.getUser();try{await meApi(`profiles?id=eq.${u.id}`,{method:'PATCH',body:{status:'HIRED'}});await loadMe();myProfile()}catch(e){alert('Ntibyashoboye kubika.')}}
function reactivate(){payMode='reactivate';go('/pay')}
function logout(){fetch(`${SUPABASE_URL}/auth/v1/logout`,{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+((Sess.get()||{}).access_token||'')}}).catch(()=>{});Sess.clear();ME.profile=null;Store.setDraft(null);selectedRole='';draftData={};go('/')}
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;instRefresh()});
window.addEventListener('appinstalled',function(){deferredInstall=null;instRefresh()});
function isStandalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)}
function instRefresh(){const b=document.getElementById('inst');if(!b)return;const show=!isStandalone()&&(!!deferredInstall||isIOS());b.hidden=!show;b.dataset.mode=deferredInstall?'prompt':'ios'}
async function instGo(){const b=document.getElementById('inst');if(b.dataset.mode==='prompt'&&deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;instRefresh();return}alert('Kanda Share, hanyuma hitamo "Add to Home Screen".')}
function revealWords(){document.querySelectorAll('.land-msg,.land-tag,.land-desc').forEach(function(el){if(el.dataset.split)return;el.dataset.split='1';const t=el.textContent.trim();el.setAttribute('aria-label',t);el.innerHTML=t.split(/\s+/).map(function(w,i){return '<span class="w" aria-hidden="true" style="--i:'+i+'">'+w+'</span>'}).join(' ')})}
(function(){try{const sp=new URLSearchParams(location.search);const q=sp.get('pay')||sp.get('OrderMerchantReference');const raw=localStorage.getItem('uk.pay');if(!q||!raw)return;const r=JSON.parse(raw);if(r.id!==q)return;localStorage.removeItem('uk.pay');window.umkResume=r;history.replaceState(null,'',location.pathname+'#/pay')}catch(e){}})();
window.addEventListener('hashchange',render);Store.load();render();loadRemote().then(render);loadMe().then(render);
(function(){let d=null;document.addEventListener('pointerdown',e=>{const r=e.target.closest&&e.target.closest('.hrow');if(!r||e.pointerType!=='mouse')return;d={r,x:e.clientX,l:r.scrollLeft,m:false};r.style.scrollSnapType='none';r.style.scrollBehavior='auto'});document.addEventListener('pointermove',e=>{if(!d)return;const dx=e.clientX-d.x;if(Math.abs(dx)>4)d.m=true;d.r.scrollLeft=d.l-dx});const end=()=>{if(!d)return;d.r.style.scrollSnapType='';d.r.style.scrollBehavior='';setTimeout(()=>{d=null},0)};document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);document.addEventListener('click',e=>{if(d&&d.m){e.stopPropagation();e.preventDefault()}},true)})();
</script></body></html>
